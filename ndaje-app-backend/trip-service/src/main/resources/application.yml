server:
  port: 8084 # Évite conflit avec Keycloak Admin (8081)

spring:
  application:
    name: trip-service
  datasource:
    url: jdbc:postgresql://localhost:5433/ndaje_trip_db
    username: postgres
    password: admin
  jpa:
    hibernate:
      ddl-auto: create
    show-sql: true

logging:
  level:
    com.ndaje.trip: DEBUG

eureka:
  instance:
    prefer-ip-address: true
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    fetch-registry: true
    register-with-eureka: true

