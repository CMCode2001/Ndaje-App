server:
  port: 8084 # Évite conflit avec Keycloak Admin (8081)

spring:
  application:
    name: trip-service
  datasource:
    url: ${TRIP_DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: create
    show-sql: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8081/realms/ndajee-realm
          jwk-set-uri: http://localhost:8081/realms/ndajee-realm/protocol/openid-connect/certs

logging:
  level:
    com.ndaje.trip: DEBUG

eureka:
  instance:
    prefer-ip-address: true
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    fetch-registry: true
    register-with-eureka: true

application:
  config:
    user-service-url: http://localhost:8082
    car-service-url: http://localhost:8089
