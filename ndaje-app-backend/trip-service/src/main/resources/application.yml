server:
  port: 8091

spring:
  application:
    name: trip-service
  datasource:
    url: jdbc:postgresql://localhost:5432/tripDB
    username: postgres
    password: cmc
  jpa:
    hibernate:
      ddl-auto: create
    show-sql: true

logging:
  level:
    com.ndaje.trip: DEBUG

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true
