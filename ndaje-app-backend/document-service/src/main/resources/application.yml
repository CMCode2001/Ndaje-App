spring:
  application:
    name: document-service
  
  datasource:
    url: jdbc:postgresql://localhost:5433/ndaje_document_db
    username: postgres
    password: admin
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8081/realms/ndajee-realm
          jwk-set-uri: http://localhost:8081/realms/ndajee-realm/protocol/openid-connect/certs

server:
  port: 8086

# Cloudflare R2 Configuration (S3-compatible)
cloudflare:
  r2:
    account-id: ${R2_ACCOUNT_ID}
    access-key: ${R2_ACCESS_KEY}
    secret-key: ${R2_SECRET_KEY}
    endpoint: ${R2_ENDPOINT}
    bucket: ${R2_BUCKET}
    region: auto

# Mapping for S3 Client (compatibility layer)
# aws:
#   s3:
#     bucket-name: ${cloudflare.r2.bucket}
#     region: ${cloudflare.r2.region}
#     access-key: ${cloudflare.r2.access-key}
#     secret-key: ${cloudflare.r2.secret-key}
#     endpoint: ${cloudflare.r2.endpoint}

# Eureka Client Configuration
eureka:
  instance:
    prefer-ip-address: true
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/

# Logging
logging:
  level:
    com.ndajee.documentservice: DEBUG
    software.amazon.awssdk: INFO
