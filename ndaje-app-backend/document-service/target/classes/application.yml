spring:
  application:
    name: document-service
  
  datasource:
    url: jdbc:postgresql://localhost:5433/ndaje_document_db
    username: postgres
    password: admin
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8081/realms/ndajee-realm
          jwk-set-uri: http://localhost:8081/realms/ndajee-realm/protocol/openid-connect/certs

server:
  port: 8086

