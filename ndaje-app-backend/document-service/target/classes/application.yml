spring:
  application:
    name: document-service
  datasource:
    url: ${Document_DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8081/realms/ndajee-realm
          jwk-set-uri: http://localhost:8081/realms/ndajee-realm/protocol/openid-connect/certs

server:
  port: 8086

# MinIO Configuration (S3-compatible)
minio:
  access-key: ${MINIO_ACCESS_KEY}
  secret-key: ${MINIO_SECRET_KEY}
  endpoint: ${MINIO_ENDPOINT}
  bucket: ${MINIO_BUCKET}

# Eureka Client Configuration
eureka:
  instance:
    prefer-ip-address: true
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/

# Logging
logging:
  level:
    com.ndajee.documentservice: DEBUG
    software.amazon.awssdk: INFO
