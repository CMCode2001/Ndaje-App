spring.application.name=user-service

# Swagger / SpringDoc
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html


# Port de demarrage de user-service
server.port=8082

# Config de eureka client
eureka.client.enabled=true
eureka.instance.prefer-ip-address=true

#Config de la cle public de oauth2
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8081/realms/ndajee-realm
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8081/realms/ndajee-realm/protocol/openid-connect/certs

#Propri�t�s pour le client admin Keycloak (utilis�es par ta config KeycloakAdminClientConfig)
keycloak.admin.server-url=${KEYCLOAK_SERVER_URL:http://localhost:8081}
keycloak.admin.realm=${KEYCLOAK_REALM:ndajee-realm}
keycloak.admin.client-id=${KEYCLOAK_ADMIN_CLIENT_ID:ndajee-client}
keycloak.admin.client-secret=${KEYCLOAK_ADMIN_CLIENT_SECRET}



