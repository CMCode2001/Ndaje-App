# ==============================
#   CONFIG POSTGRES + FLYWAY
#   (� activer quand tu passes en Postgres)
# ==============================

# --- D�commente ce bloc pour utiliser Postgres au lieu de H2 ---
spring.datasource.url=${USER_DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# ==============================
#   MINIO (Stockage documents)
# ==============================
minio.access-key=${MINIO_ACCESS_KEY}
minio.secret-key=${MINIO_SECRET_KEY}
minio.endpoint=${MINIO_ENDPOINT}
minio.bucket=${MINIO_BUCKET}

# Taille maximale des fichiers uploadés
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Logging
logging.level.com.ndajee.userservice=DEBUG
logging.level.software.amazon.awssdk=INFO
