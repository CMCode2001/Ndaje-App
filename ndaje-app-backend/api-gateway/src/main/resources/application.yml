server:
  port: 9000

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: ["http://localhost:5173", "http://localhost:7000"]
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
              - PATCH
            allowedHeaders: "*"
            allowCredentials: true
      routes:
        # Route Trip Service (trajets + notations)
        - id: trip-service-trips
          uri: lb://trip-service
          predicates:
            - Path=/api/trips/**

        # Route Notations → Trip Service (migration depuis reservation-service)
        - id: trip-service-notations
          uri: lb://trip-service
          predicates:
            - Path=/api/notations/**

        # Route Caravanes → Trip Service
        - id: trip-service-caravanes
          uri: lb://trip-service
          predicates:
            - Path=/api/caravanes/**

        # Route User Service (Avec Rate Limiting sur /api/users/login)
        - id: user-service-login
          uri: lb://user-service
          predicates:
            - Path=/api/users/login
            - Method=POST
          filters:
            - name: RequestRateLimiter
              args:
                "[redis-rate-limiter.replenishRate]": 5
                "[redis-rate-limiter.burstCapacity]": 10
                "[redis-rate-limiter.requestedTokens]": 1
                key-resolver: "#{@ipKeyResolver}"
        
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/api/users/**, /api/admin/**

        # Route Car Service (véhicules + documents véhicules intégrés)
        - id: car-service
          uri: lb://car-service
          predicates:
            - Path=/api/vehicules/**

        # Route Reservation Service (Désormais géré par trip-service)
        - id: reservation-service-redirect
          uri: lb://trip-service
          predicates:
            - Path=/api/reservations/**

eureka:
  instance:
    prefer-ip-address: true
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
